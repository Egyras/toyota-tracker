# For LOCAL DEVELOPMENT only — run with: docker compose up
# Production deployment is handled by Jenkins (see Jenkinsfile)
# Cloudflared runs as a separate TrueNAS App

version: "3.8"
services:
  toyota-tracker:
    build: .
    container_name: toyota-tracker
    ports:
      - "8888:8080"
    environment:
      - DB_PATH=/data/stats.db
      - TOYOTA_USERNAME=
      - TOYOTA_PASSWORD=
    volumes:
      - toyota-tracker-data:/data
    restart: unless-stopped

volumes:
  toyota-tracker-data:
